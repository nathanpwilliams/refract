name: Deploy demo site

# Publishes the pre-built site/ directory to GitHub Pages.
#
# The site is generated locally by scripts/build_demo.py (which reads the
# database) and committed. This workflow only uploads what is already in
# the repository: it needs no database, no API key, and no secret of any
# kind. Nothing here can reach the Supabase project.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
